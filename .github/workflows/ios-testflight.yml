# Builds the iOS app on a cloud Mac, signs it, and uploads it to TestFlight.
# Run it from the Actions tab: "iOS TestFlight" -> "Run workflow".
# Needs these repository secrets (Settings -> Secrets and variables -> Actions):
#   APPLE_TEAM_ID   10-character Team ID from developer.apple.com -> Membership
#   ASC_KEY_ID      App Store Connect API key ID
#   ASC_ISSUER_ID   App Store Connect API issuer ID
#   ASC_KEY_P8      Full contents of the downloaded AuthKey_XXXX.p8 file
name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      version:
        description: App version shown on the App Store (e.g. 1.0)
        required: true
        default: '1.0'

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install and sync web app into the iOS project
        env:
          IS_BUILD: ${{ github.run_number }}
        run: |
          npm ci
          npm run sync

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey.p8"

      # Archive signed for development so the app's iCloud entitlements are kept (this needs at
      # least one iPhone registered under Devices). The export step re-signs it for the App Store.
      - name: Archive
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            MARKETING_VERSION="${{ inputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" 2>&1 | tee "$RUNNER_TEMP/archive.log"; code=${PIPESTATUS[0]}
          # Show what failed right on the run page.
          grep -E "error:|\*\* ARCHIVE FAILED|No profiles|Provisioning profile" "$RUNNER_TEMP/archive.log" | sort -u | head -12 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done
          exit $code

      - name: Sign and upload to App Store Connect
        run: |
          plutil -insert teamID -string "${{ secrets.APPLE_TEAM_ID }}" ios/ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"

      - name: Clean up key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
