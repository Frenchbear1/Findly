# Builds the Windows app (Findly.exe and its installer) and puts both on the "Windows app" release page.
# Run it from the Actions tab: "Windows app" -> "Run workflow".
name: Windows app

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build
        run: npx tauri build
      - name: Collect
        shell: bash
        run: |
          mkdir out
          cp src-tauri/target/release/findly.exe "out/Findly.exe"
          cp src-tauri/target/release/bundle/nsis/*.exe "out/Findly-Setup.exe"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: Findly-Windows
          path: out/*.exe
      - name: Publish to the "Windows app" release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view windows >/dev/null 2>&1 || gh release create windows --title "Windows app" --notes "Findly for Windows. Findly-Setup.exe installs it (Start menu, uninstaller); Findly.exe runs without installing." --latest=false
          gh release upload windows out/Findly.exe out/Findly-Setup.exe --clobber
